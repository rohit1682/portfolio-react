<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Rohit Ghosh</title>
    <meta http-equiv="refresh" content="3; url=/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        font-family: 'Inter', system-ui, sans-serif;
        background: #080608; color: #f0ecee;
        text-align: center; padding: 24px;
      }
      h1 {
        font-size: clamp(4rem, 14vw, 8rem); margin: 0;
        background: linear-gradient(135deg, #b91c2e, #e85d75 60%, #f59e6b);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        font-weight: 900; letter-spacing: -4px;
      }
      p { color: #a08898; margin: 8px 0 24px; }
      a {
        display: inline-block; padding: 10px 20px;
        border-radius: 10px; color: #fff;
        background: linear-gradient(135deg, #b91c2e, #e85d75);
        text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>Page not found. Redirecting you home…</p>
      <a href="/">Go home now</a>
    </main>
  </body>
</html>
